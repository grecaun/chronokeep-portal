[package]
name = "chronokeep-portal"
version = '0.2.4'
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features=false, features = ["blocking", "json", "rustls"] }
socket2 = "0.6.5"
if-addrs = "0.15.0"
rodio = "0.23.0"
dotenv = "0.15.0"
tiny_http = "0.12.0"
ina219 = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22.1", features = ["hal"] }
i2c-character-display = "0.6.0"

[dependencies.rusqlite]
version = "0.43.0"
features = ["bundled"]

# Fixes missing waits in the display init that sometimes left the screen showing garbage.
# See patches/i2c-character-display/PATCHED.md.
[patch.crates-io]
i2c-character-display = { path = "patches/i2c-character-display" }
